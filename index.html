<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScamGuard - Anti-Scam Training & Simulator</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #8bb8ff; /* Light Blue Background */
      color: #1e293b;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    /* Container Card */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 800px;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
    }

    h1, h2 {
      color: #0f172a;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
    }

    .subtitle {
      text-align: center;
      color: #2563eb;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .line {
      width: 80px;
      height: 4px;
      background-color: #2563eb;
      margin-bottom: 20px;
      border-radius: 2px;
    }

    /* Email Quiz Section */
    .email-container {
      background-color: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      margin-top: 15px;
    }

    .email-header {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .email-header div {
      margin-bottom: 4px;
    }

    .email-body {
      background: #ffffff;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      line-height: 1.5;
    }

    .quiz-actions {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-real {
      background-color: #22c55e;
      color: white;
    }

    .btn-real:hover { background-color: #16a34a; }

    .btn-fake {
      background-color: #ef4444;
      color: white;
    }

    .btn-fake:hover { background-color: #dc2626; }

    .btn-next {
      background-color: #2563eb;
      color: white;
      width: 100%;
      margin-top: 15px;
      display: none;
    }

    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      display: none;
    }

    .feedback.correct {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .feedback.incorrect {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    /* AI Call Simulator Section */
    .call-box {
      background-color: #1e293b;
      color: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #64748b;
      margin-right: 6px;
    }

    .status-indicator.active {
      background-color: #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
